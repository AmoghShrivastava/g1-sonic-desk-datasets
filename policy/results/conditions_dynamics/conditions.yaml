# Dynamics conditions for the SONIC desk (2026-11-06; docs/conditions.md, docs/sonic.md). conditions.yaml perturbs
# what the policy sees; these perturb what the robot and the apple do, where a simulator and the real lab differ
# most. Each is one cell against the baseline, paired by episode: the same apple and plate draws, the same latency
# draws. With 9 rows, Holm's floor (docs/conditions.md) needs 9 baseline successes for any row to show a break.
#
# Every range stays within what is physically plausible for this robot and this object: a stress test of real
# variation, not of impossible worlds (the first version drew a 250-350 g apple and 80 ms of motor delay; both were
# past anything real). Reference values in the desk twin: the apple weighs 0.15 kg with sliding friction 1.0, the desk
# 0.8; SONIC's servo gains are compose_desk.py's (NVIDIA's armature x (2 pi 10 Hz)^2).
# `object.scale` is left out on purpose: it scales the apple's collision spheres but not its mesh.
#
# A dynamics condition is applied before t = 0 and the robot settles again under it (SonicWorld.apply_condition).
- {id: slippery_surfaces, physics: {friction_scale: [0.6, 0.9]}}      # a polished floor or a wiped desk, feet included
- {id: light_apple, object: {mass_kg: [0.10, 0.13]}}                  # a small apple
- {id: heavy_apple, object: {mass_kg: [0.20, 0.25]}}                  # a large one: about the heaviest common apple
- {id: waxy_apple, object: {friction: [0.4, 0.6]}}                    # a waxed skin against the fingertips
- {id: weak_servos, physics: {gain_scale: [0.85, 0.95]}}              # motor-to-motor spread, a warm motor's derating
- {id: stiff_servos, physics: {gain_scale: [1.05, 1.15]}}
- {id: joint_damping, physics: {damping_scale: [1.2, 2.0]}}           # cold or worn joints
- {id: actuation_delay_5_15ms, physics: {actuation_delay_ms: [5, 15]}}   # bus and driver latency on top of the 50 Hz loop
- {id: actuation_delay_15_30ms, physics: {actuation_delay_ms: [15, 30]}} # a loaded system: the plausible worst case
